<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiHun Portfolio</title>
  <meta name="description" content="Healthcare AI 연구 포트폴리오 — 특허, 학회 발표, 논문, 수료 이력">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#top" class="brand" id="brand">KiHun</a>
      <nav class="nav" aria-label="섹션">
        <a href="#education">Education</a>
        <a href="#patents">Patents</a>
        <a href="#conferences">Conferences</a>
        <a href="#publications">Publications</a>
        <a href="#certificates">Certificates</a>
        <a href="#skills">Skills</a>
      </nav>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="다크 모드 전환">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container hero-inner">
        <div class="hero-text">
          <p class="eyebrow" id="role"></p>
          <h1 id="name"></h1>
          <p class="tagline" id="tagline"></p>
          <p class="intro" id="intro"></p>
          <ul class="chips" id="interests"></ul>
          <div class="hero-links" id="heroLinks"></div>
        </div>
        <div class="hero-photo" id="photo"></div>
      </div>
      <div class="container">
        <dl class="stats" id="stats"></dl>
      </div>
    </section>

    <section id="education" class="section">
      <div class="container">
        <h2 class="section-title"><span>01</span>Education</h2>
        <div id="educationList"></div>
      </div>
    </section>

    <section id="patents" class="section">
      <div class="container">
        <h2 class="section-title"><span>02</span>Patents</h2>
        <div class="grid" id="patentList"></div>
      </div>
    </section>

    <section id="conferences" class="section">
      <div class="container">
        <h2 class="section-title"><span>03</span>Conference Presentations</h2>
        <ol class="timeline" id="conferenceList"></ol>
      </div>
    </section>

    <section id="publications" class="section">
      <div class="container">
        <h2 class="section-title"><span>04</span>Publications</h2>
        <div id="publicationList"></div>
      </div>
    </section>

    <section id="certificates" class="section">
      <div class="container">
        <h2 class="section-title"><span>05</span>Certificates &amp; Training</h2>
        <div class="tabs" id="certTabs" role="tablist"></div>
        <div class="grid grid-3" id="certList"></div>
      </div>
    </section>

    <section id="skills" class="section">
      <div class="container">
        <h2 class="section-title"><span>06</span>Skills</h2>
        <div class="skills" id="skillList"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div id="footerLinks" class="hero-links"></div>
      <p class="muted" id="copyright"></p>
    </div>
  </footer>

  <dialog id="viewer" class="viewer">
    <form method="dialog"><button class="icon-btn viewer-close" aria-label="닫기">✕</button></form>
    <img id="viewerImg" alt="">
    <p id="viewerCaption" class="muted"></p>
  </dialog>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
